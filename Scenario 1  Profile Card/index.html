<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arjun Kumar - Profile Card</title>
    <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="profile-card">
    <div class="banner"></div>
    <div class="avatar">AK</div>
    <h2 class="name">Arjun Kumar</h2>
    <p class="role">Web Developer</p>
    <p class="followers"><strong id="follower-count">120</strong> Followers</p>
    <ul class="skills">
      <li>HTML</li>
      <li>CSS</li>
      <li>JS</li>
      <li>Git</li>
    </ul>
    <button type="button" id="follow-btn" class="follow-btn">Follow</button>
  </div>
<script src="./main.js"></script>

 
</body>
</html>
